version: "3.7"

services:
    postgresql:
        image: postgres:15.7
        container_name: postgresql
        command: postgres -c 'max_connections=200'
        environment:
          POSTGRES_DB: bank
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
        ports:
        - "5432:5432"
        volumes:
        - postgres1:/var/lib/postgresql/data
        networks:
        - network-local

    zookeeper:
      image: confluentinc/cp-zookeeper:latest
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "2181:2181"
      networks:
        - network-local

    kafka:
      image: confluentinc/cp-kafka:latest
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      networks:
        - network-local
      volumes:
        - kafka_data:/var/lib/kafka/data

    core-app:
      container_name: core-app
      build:
        context: .
        dockerfile: ./Dockerfile
        args:
          JAR_FILE: "build/libs/bank-core-service-1.0.0.jar"
      depends_on:
        - postgresql
        - kafka
      ports:
        - "9444:9444"
      networks:
        - network-local
      environment:
        USER_DATABASE_URL: jdbc:postgresql://postgresql:5432/bank
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 12345

volumes:
    postgres1:
      driver: local
    cassandra:
    kafka_data:
      driver: local


networks:
    network-local:
        driver: bridge
