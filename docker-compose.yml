version: "3.7"

services:
    postgres-15.7:
        image: postgres:15.7
        command: postgres -c 'max_connections=200'
        environment:
          POSTGRES_DB: bank
          POSTGRES_PASSWORD: "12345"
        ports:
        - "5436:5432"
        volumes:
        - postgres:/var/lib/postgresql/data
        networks:
        - network-local

    kafka-service:
      image: bitnami/kafka:latest
      restart: always
      hostname: kafka-service
      environment:
        KAFKA_ENABLE_KRAFT: yes
        KAFKA_CFG_PROCESS_ROLES: broker
        KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
        KAFKA_CFG_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092
        KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
        KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka-service:9094,EXTERNAL://localhost:9092
        KAFKA_CFG_NODE_ID: 1
        ALLOW_PLAINTEXT_LISTENER: yes
        KAFKA_KRAFT_CLUSTER_ID: 2
      ports:
        - "9092:9092"
      networks:
        - network-local
    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      ports:
        - "9090:8080"
      depends_on:
        - kafka-service
      environment:
        KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-service:9094
        KAFKA_CLUSTERS_0_NAME: local
      networks:
        - network-local


volumes:
    postgres:
        driver: local
    cassandra:
    kafka_data:

networks:
    network-local:
        driver: bridge
